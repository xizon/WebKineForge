
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="390" viewBox="0 0 1440 390">
  <defs>
    <style>
      .panel { fill: #111827; stroke: #273449; stroke-width: 1; }
      .bar { fill: #1b2638; }
      .filename { font: 600 15px -apple-system, sans-serif; fill: #e5e7eb; }
      .lang { font: 600 12px -apple-system, sans-serif; fill: #94a3b8; letter-spacing: 1px; }
      .code { font: 12px SFMono-Regular, Consolas, monospace; fill: #dbe4f0; }
      .kw { fill: #c792ea; }
      .fn { fill: #82aaff; }
      .str { fill: #c3e88d; }
      .prop { fill: #f78c6c; }
    </style>
  </defs>

  <rect width="1440" height="410" fill="transparent"/>

  <!-- HTML -->
  <g transform="translate(20 20)">
    <rect class="panel" width="450" height="370" rx="12"/>
    <path class="bar" d="M12 0h426a12 12 0 0 1 12 12v38H0V12A12 12 0 0 1 12 0z"/>
    <circle cx="20" cy="25" r="5" fill="#fb7185"/>
    <circle cx="38" cy="25" r="5" fill="#fbbf24"/>
    <circle cx="56" cy="25" r="5" fill="#34d399"/>
    <text class="filename" x="82" y="30">HTML</text>
    <text class="lang" x="425" y="29" text-anchor="end">template.tsx</text>

    <g class="code">
      <text x="20" y="82"><tspan class="kw">export function</tspan> <tspan class="fn">Temp</tspan>() {</text>
      <text x="38" y="104"><tspan class="kw">return</tspan> (</text>
      <text x="56" y="126">&lt;<tspan class="fn">div</tspan> <tspan class="prop">className</tspan>=<tspan class="str">"wkf-card"</tspan>&gt;</text>
      <text x="74" y="148">&lt;<tspan class="fn">img</tspan> <tspan class="prop">src</tspan>=<tspan class="str">"/images/product.jpg"</tspan> <tspan class="prop">alt</tspan>=<tspan class="str">""</tspan> /&gt;</text>
      <text x="74" y="170">&lt;<tspan class="fn">h3</tspan>&gt;Product Name&lt;/<tspan class="fn">h3</tspan>&gt;</text>
      <text x="74" y="192">&lt;<tspan class="fn">p</tspan>&gt;Hello World!&lt;/<tspan class="fn">p</tspan>&gt;</text>
      <text x="74" y="214">&lt;<tspan class="fn">button</tspan> <tspan class="prop">type</tspan>=<tspan class="str">"button"</tspan></text>
      <text x="92" y="236"><tspan class="prop">id</tspan>=<tspan class="str">"wkf-card-btn"</tspan>&gt;Explore&lt;/<tspan class="fn">button</tspan>&gt;</text>
      <text x="56" y="258">&lt;/<tspan class="fn">div</tspan>&gt;</text>
      <text x="38" y="280">);</text>
      <text x="20" y="302">}</text>
    </g>
  </g>

  <!-- CSS -->
  <g transform="translate(495 20)">
    <rect class="panel" width="450" height="370" rx="12"/>
    <path class="bar" d="M12 0h426a12 12 0 0 1 12 12v38H0V12A12 12 0 0 1 12 0z"/>
    <circle cx="20" cy="25" r="5" fill="#fb7185"/>
    <circle cx="38" cy="25" r="5" fill="#fbbf24"/>
    <circle cx="56" cy="25" r="5" fill="#34d399"/>
    <text class="filename" x="82" y="30">CSS</text>
    <text class="lang" x="425" y="29" text-anchor="end">style.css</text>

    <g class="code">
      <text x="20" y="82"><tspan class="prop">.wkf-card</tspan> {</text>
      <text x="38" y="104"><tspan class="fn">padding</tspan>: <tspan class="str">24px</tspan>;</text>
      <text x="38" y="126"><tspan class="fn">border-radius</tspan>: <tspan class="str">16px</tspan>;</text>
      <text x="38" y="148"><tspan class="fn">background</tspan>: <tspan class="str">white</tspan>;</text>
      <text x="38" y="192"><tspan class="fn">img</tspan> {</text>
      <text x="56" y="214"><tspan class="fn">width</tspan>: <tspan class="str">100%</tspan>;</text>
      <text x="38" y="236">}</text>
      <text x="20" y="258">}</text>
    </g>
  </g>

  <!-- JavaScript -->
  <g transform="translate(970 20)">
    <rect class="panel" width="450" height="370" rx="12"/>
    <path class="bar" d="M12 0h426a12 12 0 0 1 12 12v38H0V12A12 12 0 0 1 12 0z"/>
    <circle cx="20" cy="25" r="5" fill="#fb7185"/>
    <circle cx="38" cy="25" r="5" fill="#fbbf24"/>
    <circle cx="56" cy="25" r="5" fill="#34d399"/>
    <text class="filename" x="82" y="30">JS</text>
    <text class="lang" x="425" y="29" text-anchor="end">controller.ts</text>

    <g class="code" font-size="11">
      <text x="16" y="78"><tspan class="kw">import</tspan> { gsap } <tspan class="kw">from</tspan> <tspan class="str">'gsap'</tspan>;</text>
      <text x="16" y="98"><tspan class="kw">export function</tspan> <tspan class="fn">mount</tspan>(element: HTMLElement | <tspan class="kw">null</tspan>) {</text>
      <text x="34" y="118"><tspan class="kw">if</tspan> (!element) <tspan class="kw">return</tspan>;</text>
      <text x="34" y="158"><tspan class="kw">const</tspan> button = element.<tspan class="fn">querySelector</tspan>(<tspan class="str">'#wkf-card-btn'</tspan>);</text>
      <text x="34" y="178"><tspan class="kw">const</tspan> onClick = () =&gt; {</text>
      <text x="52" y="198">gsap.<tspan class="fn">to</tspan>(element, { <tspan class="prop">scale</tspan>: <tspan class="str">1.03</tspan>, <tspan class="prop">duration</tspan>: <tspan class="str">0.3</tspan>,</text>
      <text x="52" y="218"><tspan class="prop">yoyo</tspan>: <tspan class="kw">true</tspan>, <tspan class="prop">repeat</tspan>: <tspan class="str">1</tspan>});</text>
      <text x="34" y="238">};</text>
      <text x="34" y="278">button?.<tspan class="fn">addEventListener</tspan>(<tspan class="str">'click'</tspan>, onClick);</text>
      <text x="34" y="298"><tspan class="kw">return</tspan> () =&gt; {</text>
      <text x="52" y="318">button?.<tspan class="fn">removeEventListener</tspan>(<tspan class="str">'click'</tspan>, onClick);</text>
      <text x="34" y="338">};</text>
      <text x="16" y="358">}</text>
    </g>
  </g>
</svg>
